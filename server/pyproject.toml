[project]
name = "classroom-server"
version = "0.0.0"
description = "강의 상호작용 도구 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "websockets==17.4",  # uvicorn이 WebSocket(교수 화면 실시간)을 서비스하려면 필요하다. 없으면 연결이 거부된다
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "httpx==0.28.1",  # 서버 테스트 클라이언트(starlette TestClient)가 요구. 런타임에는 쓰지 않는다
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "constitution: constitution의 필수 회귀 테스트 (CI의 constitution-tests 작업이 따로 실행)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
