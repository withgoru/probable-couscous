# 의존성 갱신 PR을 주 1회 만든다. 머지 전에 CI와 변경 내용을 확인한다 (C17).
# 폴더가 아직 없으면 해당 항목은 무시되거나 오류가 날 수 있으니, server/ client/ 가 생긴 뒤에 켠다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7(typescript-go)은 SvelteKit 3이 아직 지원하지 않는다(peer: ^6). 지원하면 규칙을 지운다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 타입은 CI와 로컬의 Node 버전(22)을 따라간다. Node를 올릴 때 함께 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
