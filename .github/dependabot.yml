# 의존성 갱신 PR을 주 1회 만든다. 머지 전에 CI와 변경 내용을 확인한다 (C17).
# 폴더가 아직 없으면 해당 항목은 무시되거나 오류가 날 수 있으니, server/ client/ 가 생긴 뒤에 켠다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # server/, client/ 가 생기면 아래 두 항목의 주석("# ")을 푼다 (없는 폴더를 가리키면 Dependabot이 오류를 낸다).
  # - package-ecosystem: npm
  #   directory: "/client"
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5
  # - package-ecosystem: pip
  #   directory: "/server"
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5
